<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link rel="stylesheet" href="event.css">
</head>
<body>
    <div id="events-page">
    <aside id="sidebar">
        <button class="back-btn">
            ← Back
        </button>
        <div class="filter">
            <label>Category:</label>
            <select id="category">
                <option value="tech" selected>All</option>
                <option value="tech">Tech</option>
                <option value="startup">Startup</option>
                <option value="music">Music</option>
                <option value="workshop">Workshop</option>
                <option value="sports">Sports</option>
                <option value="education">Education</option>
            </select>
        </div>

        <div class="filter">
            <label>Date:</label>
            <input id="date" type="date">
        </div>

        <div class="filter">
            <label>Price Range:</label>
            <select id="price">
                <option value="">All Prices</option>
                <option value="30-100">30 - 100</option>
                <option value="100-250">100 - 250</option>
                <option value="250-500">250 - 500</option>
                <option value="500-1000">500 - 1000</option>
                <option value="1000-1500">1000 - 1500</option>
                <option value="1500-2000">1500 - 2000</option>
                <option value="2000-2500">2000 - 2500</option>
            </select>
        </div>

        <div class="filter">
            <label>
                <input type="radio" value="free" id="free" name="radio" checked>
                Free
            </label>
            <label>
                <input type="radio" value="paid"  id="paid" name="radio">
                Paid
            </label>
        </div>
    </aside>

    <section id="main-container">
        <div id="top-bar">
            <div class="control" id="search-bar">
                <label id="search">Search</label>
                <input type="text" placeholder="Event Name,Organizer,Venue">
            </div>
            
            <div class="button">
                <button class="filter-button apply">Apply</button>
                <button class="filter-button clear">Clear</button>
                <div class="control" id="sort-bar">
                    <label id="sort">Sort</label>
                    <select id="sort-bar-select">
                        <option value="newest">Latest-Event</option>
                        <option value="oldest">Oldest-Event</option>
                        <option value="lowest">Lowest-Price</option>
                        <option value="highest">Highest-Price</option>
                        <option value="alphabetical">A-Z</option>
                    </select>
                </div>
            </div>
        </div>

            <section id="event-card-template">
                <article class="event-card" data-event-id="">
            
                    <img class="event-image" src="https://images.unsplash.com/photo-1561489396-888724a1543d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fGV2ZW50fGVufDB8fDB8fHww" alt="Image">
            
                    <div class="event-body">
            
                        <h3 class="event-title">CES (Consumer Electronics Show)</h3>
            
                        <div class="event-meta">
                            <p class="event-organizer">
                                <span class="label">Organizer:</span>
                                <span class="value organizer-name">Google</span>
                            </p>
                            <p class="event-category-row">
                                <span class="label">Category:</span>
                                <span class="value event-category">Tech</span>
                            </p>
                        </div>
            
                        <ul class="event-details">
                            <li class="event-date">
                                <span class="icon">📅</span>
                                <span class="label">Date:</span>
                                <span class="value event-date-value">5-11-2026</span>
                            </li>
                            <li class="event-time">
                                <span class="icon">🕐</span>
                                <span class="label">Time:</span>
                                <span class="value event-time-value">10:00am</span>
                            </li>
                            <li class="event-venue">
                                <span class="icon">📍</span>
                                <span class="label">Venue:</span>
                                <span class="value event-venue-value">Mumbai</span>
                            </li>
                        </ul>
            
                        <div class="event-footer">
                            <div class="event-info">
                                <p class="event-seats">
                                    <span class="label">Available Seats:</span>
                                    <span class="value seats-count">300</span>
                                </p>
                                <p class="event-price">
                                    <span class="label">Ticket Price:</span>
                                    <span class="currency">₹</span>
                                    <span class="value price-amount">500</span>
                                </p>
                            </div>
                            <div><button class="book-btn" type="button">Book Now</button></div>
                        </div>
            
                    </div>
                </article>
            </section>
    </section>

    </div>
<script src="render.js"></script>
<script src="eventsData.js"></script>
<script src="events.js"></script>
</body>
</html>
